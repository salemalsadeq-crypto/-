<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الإعلانات | فلسطين بلاتفورم</title>

<style>

/* =========================
   عام
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Tahoma, sans-serif;
    background: #f5f7fa;
    color: #172033;
}

button,
input,
select,
textarea {
    font-family: inherit;
}


/* =========================
   الهيدر
========================= */

header {
    background: white;
    padding: 16px 20px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.header {
    max-width: 1100px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    color: #173b68;
}

.logo span {
    color: #b51f2a;
}

.back {
    text-decoration: none;
    background: #173b68;
    color: white;
    padding: 9px 16px;
    border-radius: 8px;
}


/* =========================
   العنوان
========================= */

.hero {
    background: #173b68;
    color: white;
    text-align: center;
    padding: 45px 20px;
}

.hero h1 {
    font-size: 34px;
    margin-bottom: 10px;
}

.hero p {
    font-size: 17px;
}


/* =========================
   المحتوى
========================= */

.container {
    max-width: 1100px;
    margin: auto;
    padding: 35px 20px;
}


/* =========================
   زر إضافة إعلان
========================= */

.add {
    display: block;
    width: 100%;
    text-align: center;
    background: #b51f2a;
    color: white;
    padding: 14px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-weight: bold;
    cursor: pointer;
    border: none;
    font-size: 16px;
}


/* =========================
   البحث والفلاتر
========================= */

.filters {
    background: white;
    padding: 18px;
    border-radius: 14px;
    margin-bottom: 25px;
    box-shadow: 0 3px 15px rgba(0,0,0,.06);
}

.search {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

.search input {
    flex: 1;
    border: 1px solid #ddd;
    outline: none;
    padding: 13px;
    font-size: 16px;
    border-radius: 8px;
}

.search button {
    border: none;
    background: #b51f2a;
    color: white;
    padding: 0 22px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

.filter-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.filter-grid input,
.filter-grid select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    background: white;
    outline: none;
}

.filter-buttons {
    display: flex;
    gap: 10px;
    margin-top: 12px;
}

.filter-buttons button {
    flex: 1;
    border: none;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
}

.apply {
    background: #173b68;
    color: white;
}

.clear {
    background: #eee;
    color: #222;
}


/* =========================
   النتائج والترتيب
========================= */

.results-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    gap: 10px;
}

.results-count {
    color: #555;
}

.sort-select {
    padding: 9px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: white;
}


/* =========================
   بطاقات الإعلانات
========================= */

.ads-list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.ad-card {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 3px 15px rgba(0,0,0,.07);
    cursor: pointer;
    transition: .2s;
}

.ad-card:hover {
    transform: translateY(-3px);
}

.ad-image {
    width: 100%;
    height: 210px;
    object-fit: cover;
    display: block;
    background: #eee;
}

.ad-no-image {
    height: 210px;
    background: #eef2f7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 55px;
}

.ad-content {
    padding: 18px;
}

.ad-card h3 {
    color: #173b68;
    margin-bottom: 10px;
    font-size: 20px;
}

.ad-category {
    display: inline-block;
    background: #eef2f7;
    color: #173b68;
    padding: 5px 10px;
    border-radius: 15px;
    font-size: 13px;
    margin-bottom: 10px;
}

.ad-description {
    color: #555;
    line-height: 1.7;
    margin-bottom: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.ad-price {
    font-size: 19px;
    font-weight: bold;
    color: #b51f2a;
    margin: 10px 0;
}

.ad-info {
    color: #666;
    font-size: 14px;
    line-height: 1.8;
}

.ad-date {
    color: #888;
    font-size: 12px;
    margin-top: 5px;
}

.empty {
    background: white;
    padding: 50px 20px;
    border-radius: 15px;
    text-align: center;
    color: #777;
    grid-column: 1 / -1;
}


/* =========================
   النافذة
========================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 9999;
    padding: 20px;
    overflow: auto;
}

.modal-content {
    background: white;
    max-width: 600px;
    margin: 30px auto;
    border-radius: 15px;
    padding: 25px;
}

.modal h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #173b68;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
}

.form-group textarea {
    min-height: 120px;
    resize: vertical;
}


/* =========================
   الصور
========================= */

.image-help {
    font-size: 13px;
    color: #777;
    margin-top: 6px;
}

.image-preview {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-top: 12px;
}

.preview-box {
    position: relative;
    height: 90px;
    border-radius: 8px;
    overflow: hidden;
    background: #eee;
}

.preview-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.remove-image {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 25px;
    height: 25px;
    border: 0;
    border-radius: 50%;
    background: #b51f2a;
    color: white;
    cursor: pointer;
    font-weight: bold;
}


/* =========================
   أزرار النموذج
========================= */

.form-buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.form-buttons button {
    flex: 1;
    padding: 13px;
    border: 0;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

.save {
    background: #b51f2a;
    color: white;
}

.cancel {
    background: #eee;
    color: #222;
}

.message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
    line-height: 1.6;
}


/* =========================
   الهاتف
========================= */

@media (max-width: 800px) {

    .ads-list {
        grid-template-columns: repeat(2, 1fr);
    }

    .filter-grid {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media (max-width: 600px) {

    header {
        padding: 13px 12px;
    }

    .logo {
        font-size: 18px;
    }

    .back {
        font-size: 13px;
        padding: 8px 11px;
    }

    .hero {
        padding: 35px 15px;
    }

    .hero h1 {
        font-size: 28px;
    }

    .hero p {
        font-size: 15px;
    }

    .container {
        padding: 25px 12px;
    }

    .search {
        flex-direction: column;
    }

    .search input,
    .search button {
        width: 100%;
        min-height: 46px;
    }

    .filter-grid {
        grid-template-columns: 1fr;
    }

    .filter-buttons {
        flex-direction: column;
    }

    .results-info {
        flex-direction: column;
        align-items: stretch;
    }

    .sort-select {
        width: 100%;
    }

    .ads-list {
        grid-template-columns: 1fr;
    }

    .image-preview {
        grid-template-columns: repeat(3, 1fr);
    }

}

</style>

</head>

<script>

/* =====================================================
   إعداد Supabase
===================================================== */

const SUPABASE_URL =
"https://sesbumfedusbjevbsyzl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_0sJrbh73jLip3O5OtJkc_A_9F6OPWqR";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
        }
    }
);


/* =====================================================
   المتغيرات
===================================================== */

let selectedFiles = [];

let allAds = [];


/* =====================================================
   عناصر الصفحة
===================================================== */

const addButton =
document.getElementById("addButton");

const addModal =
document.getElementById("addModal");

const cancelButton =
document.getElementById("cancelButton");

const adForm =
document.getElementById("adForm");

const imagesInput =
document.getElementById("images");

const imagePreview =
document.getElementById("imagePreview");

const message =
document.getElementById("message");

const saveButton =
document.getElementById("saveButton");

const adsList =
document.getElementById("adsList");

const resultsCount =
document.getElementById("resultsCount");

const searchInput =
document.getElementById("searchInput");

const searchButton =
document.getElementById("searchButton");

const categoryFilter =
document.getElementById("categoryFilter");

const cityFilter =
document.getElementById("cityFilter");

const minPrice =
document.getElementById("minPrice");

const maxPrice =
document.getElementById("maxPrice");

const applyButton =
document.getElementById("applyButton");

const clearButton =
document.getElementById("clearButton");

const sortSelect =
document.getElementById("sortSelect");


/* =====================================================
   فتح نافذة إضافة إعلان
===================================================== */

addButton.addEventListener(
    "click",
    async function(){

        try {

            const {
                data,
                error
            } =
            await supabaseClient
            .auth
            .getUser();


            if(error || !data.user){

                alert(
                    "يجب تسجيل الدخول أولاً لإضافة إعلان."
                );

                window.location.href =
                    "login.html";

                return;
            }


            addModal.style.display =
                "block";

        }

        catch(error){

            console.error(error);

            alert(
                "حدث خطأ. يرجى تسجيل الدخول مرة أخرى."
            );

        }

    }
);


/* =====================================================
   إغلاق النافذة
===================================================== */

cancelButton.addEventListener(
    "click",
    function(){

        addModal.style.display =
            "none";

    }
);


/* إغلاق عند الضغط خارج النافذة */

addModal.addEventListener(
    "click",
    function(event){

        if(event.target === addModal){

            addModal.style.display =
                "none";

        }

    }
);


/* =====================================================
   اختيار الصور
===================================================== */

imagesInput.addEventListener(
    "change",
    function(){

        const files =
            Array.from(
                imagesInput.files
            );


        if(files.length > 5){

            alert(
                "يمكنك اختيار 5 صور كحد أقصى."
            );

            imagesInput.value =
                "";

            selectedFiles =
                [];

            renderPreview();

            return;
        }


        for(
            const file of files
        ){

            if(
                !file.type.startsWith(
                    "image/"
                )
            ){

                alert(
                    "يرجى اختيار صور فقط."
                );

                imagesInput.value =
                    "";

                selectedFiles =
                    [];

                renderPreview();

                return;
            }


            if(
                file.size >
                5 * 1024 * 1024
            ){

                alert(
                    "حجم الصورة يجب ألا يتجاوز 5MB."
                );

                imagesInput.value =
                    "";

                selectedFiles =
                    [];

                renderPreview();

                return;
            }

        }


        selectedFiles =
            files;

        renderPreview();

    }
);


/* =====================================================
   عرض معاينة الصور
===================================================== */

function renderPreview(){

    imagePreview.innerHTML =
        "";


    selectedFiles.forEach(
        function(file, index){

            const box =
                document.createElement(
                    "div"
                );

            box.className =
                "preview-box";


            const img =
                document.createElement(
                    "img"
                );

            img.src =
                URL.createObjectURL(
                    file
                );


            const remove =
                document.createElement(
                    "button"
                );

            remove.type =
                "button";

            remove.className =
                "remove-image";

            remove.textContent =
                "×";


            remove.addEventListener(
                "click",
                function(){

                    selectedFiles.splice(
                        index,
                        1
                    );

                    renderPreview();

                }
            );


            box.appendChild(img);

            box.appendChild(remove);

            imagePreview.appendChild(box);

        }
    );

}


/* =====================================================
   رفع الصور
===================================================== */

async function uploadImages(
    files,
    userId
){

    const imageUrls = [];


    for(
        let i = 0;
        i < files.length;
        i++
    ){

        const file =
            files[i];


        const extension =
            file.name
            .split(".")
            .pop()
            .toLowerCase();


        const fileName =
            userId +
            "/" +
            Date.now() +
            "_" +
            Math.random()
            .toString(36)
            .substring(2) +
            "." +
            extension;


        const result =
            await supabaseClient
            .storage
            .from("ad-images")
            .upload(
                fileName,
                file,
                {
                    cacheControl:"3600",
                    upsert:false,
                    contentType:file.type
                }
            );


        if(result.error){

            console.er
