<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الإعلانات | فلسطين بلاتفورم</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Tahoma,sans-serif;
background:#f5f7fa;
color:#172033;
}

header{
background:white;
padding:16px 20px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.header{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:22px;
font-weight:bold;
color:#173b68;
}

.logo span{
color:#b51f2a;
}

.back{
text-decoration:none;
background:#173b68;
color:white;
padding:9px 16px;
border-radius:8px;
}

.hero{
background:#173b68;
color:white;
text-align:center;
padding:45px 20px;
}

.hero h1{
font-size:34px;
margin-bottom:10px;
}

.hero p{
font-size:17px;
}

.container{
max-width:1100px;
margin:auto;
padding:35px 20px;
}

.add{
display:block;
text-align:center;
background:#b51f2a;
color:white;
text-decoration:none;
padding:14px;
border-radius:10px;
margin-bottom:25px;
font-weight:bold;
cursor:pointer;
}

.search{
background:white;
padding:8px;
border-radius:12px;
display:flex;
margin-bottom:30px;
box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.search input{
flex:1;
border:0;
outline:0;
padding:13px;
font-size:16px;
}

.search button{
border:0;
background:#b51f2a;
color:white;
padding:0 20px;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

.ads-list{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
}

.ad-card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 3px 15px rgba(0,0,0,.07);
transition:.2s;
}

.ad-card:hover{
transform:translateY(-3px);
}

.ad-image{
width:100%;
height:210px;
object-fit:cover;
display:block;
background:#eee;
}

.ad-no-image{
height:150px;
background:#eef2f7;
display:flex;
align-items:center;
justify-content:center;
font-size:55px;
}

.ad-content{
padding:20px;
}

.ad-card h3{
color:#173b68;
margin-bottom:10px;
font-size:20px;
}

.ad-category{
display:inline-block;
background:#eef2f7;
color:#173b68;
padding:5px 10px;
border-radius:15px;
font-size:13px;
margin-bottom:12px;
}

.ad-description{
color:#555;
line-height:1.7;
margin-bottom:12px;
}

.ad-info{
color:#666;
font-size:14px;
line-height:1.8;
}

.ad-price{
font-size:19px;
font-weight:bold;
color:#b51f2a;
margin:10px 0;
}

.empty{
background:white;
padding:40px;
border-radius:15px;
text-align:center;
color:#777;
grid-column:1/-1;
}

/* النافذة */

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
z-index:9999;
padding:20px;
overflow:auto;
}

.modal-content{
background:white;
max-width:600px;
margin:30px auto;
border-radius:15px;
padding:25px;
}

.modal h2{
text-align:center;
margin-bottom:20px;
color:#173b68;
}

.form-group{
margin-bottom:15px;
}

.form-group label{
display:block;
margin-bottom:7px;
font-weight:bold;
}

.form-group input,
.form-group select,
.form-group textarea{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
font-family:inherit;
}

.form-group textarea{
min-height:120px;
resize:vertical;
}

/* الصور */

.image-help{
font-size:13px;
color:#777;
margin-top:6px;
}

.image-preview{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:8px;
margin-top:12px;
}

.preview-box{
position:relative;
height:90px;
border-radius:8px;
overflow:hidden;
background:#eee;
}

.preview-box img{
width:100%;
height:100%;
object-fit:cover;
}

.remove-image{
position:absolute;
top:3px;
left:3px;
width:25px;
height:25px;
border:0;
border-radius:50%;
background:#b51f2a;
color:white;
cursor:pointer;
font-weight:bold;
}

.form-buttons{
display:flex;
gap:10px;
margin-top:20px;
}

.form-buttons button{
flex:1;
padding:13px;
border:0;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

.save{
background:#b51f2a;
color:white;
}

.cancel{
background:#eee;
color:#222;
}

.message{
text-align:center;
margin-top:15px;
font-weight:bold;
line-height:1.6;
}

@media(max-width:700px){

.ads-list{
grid-template-columns:1fr;
}

.hero h1{
font-size:28px;
}

.header{
gap:10px;
}

.logo{
font-size:18px;
}

.back{
padding:8px 12px;
font-size:14px;
}

.image-preview{
grid-template-columns:repeat(3,1fr);
}

}

</style>

</head>


<body>


<header>

<div class="header">

<div class="logo">
فلسطين <span>بلاتفورم</span>
</div>

<a href="index.html" class="back">
← الرئيسية
</a>

</div>

</header>


<section class="hero">

<h1>📢 الإعلانات</h1>

<p>
إعلانات متنوعة من جميع أنحاء فلسطين
</p>

</section>


<main class="container">


<a class="add" onclick="openAddForm()">
➕ أضف إعلانك الآن
</a>


<div class="search">

<input
type="text"
id="searchInput"
placeholder="ابحث في الإعلانات..."
>

<button onclick="searchAds()">
بحث
</button>

</div>


<div
class="ads-list"
id="adsList">

<div class="empty">
جاري تحميل الإعلانات...
</div>

</div>


</main>


<!-- نافذة إضافة إعلان -->

<div class="modal" id="addModal">

<div class="modal-content">

<h2>
➕ إضافة إعلان جديد
</h2>


<form id="adForm">


<div class="form-group">

<label>
عنوان الإعلان
</label>

<input
type="text"
id="title"
placeholder="مثال: هاتف سامسونج للبيع"
required
>

</div>


<div class="form-group">

<label>
التصنيف
</label>

<select id="category" required>

<option value="">
اختر التصنيف
</option>

<option value="أجهزة وإلكترونيات">
📱 أجهزة وإلكترونيات
</option>

<option value="أثاث ومستلزمات">
🛋️ أثاث ومستلزمات
</option>

<option value="مواشي وحيوانات">
🐄 مواشي وحيوانات
</option>

<option value="ملابس وأغراض شخصية">
👕 ملابس وأغراض شخصية
</option>

<option value="بيع وشراء">
📦 بيع وشراء
</option>

<option value="إعلانات أخرى">
📋 إعلانات أخرى
</option>

</select>

</div>


<div class="form-group">

<label>
الوصف
</label>

<textarea
id="description"
placeholder="اكتب تفاصيل الإعلان..."
required
></textarea>

</div>


<div class="form-group">

<label>
السعر
</label>

<input
type="number"
id="price"
placeholder="مثال: 1500"
min="0"
>

</div>


<div class="form-group">

<label>
المحافظة / المدينة
</label>

<input
type="text"
id="city"
placeholder="مثال: رام الله"
>

</div>


<div class="form-group">

<label>
رقم الهاتف
</label>

<input
type="tel"
id="phone"
placeholder="مثال: 059xxxxxxx"
>

</div>


<!-- الصور -->

<div class="form-group">

<label>
📷 صور الإعلان
</label>

<input
type="file"
id="images"
accept="image/jpeg,image/png,image/webp"
multiple
>

<div class="image-help">
يمكنك اختيار حتى 5 صور — الحد الأقصى 5MB للصورة الواحدة.
</div>

<div
id="imagePreview"
class="image-preview">
</div>

</div>


<div class="form-buttons">

<button
type="submit"
class="save"
id="saveButton">

نشر الإعلان

</button>


<button
type="button"
class="cancel"
onclick="closeAddForm()">

إلغاء

</button>

</div>


<div
class="message"
id="message">
</div>


</form>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
"https://sesbumfedusbjevbsyzl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_0sJrbh73jLip3O5OtJkc_A_9F6OPWqR";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY,
{
auth:{
persistSession:true,
autoRefreshToken:true,
detectSessionInUrl:true
}
}
);


let selectedFiles = [];


/* =========================
   فتح نموذج الإعلان
========================= */

async function openAddForm(){

const {
data,
error
} =
await supabaseClient.auth.getUser();


if(error || !data.user){

alert(
"يجب تسجيل الدخول أولاً لإضافة إعلان."
);

window.location.href =
"login.html";

return;

}


document.getElementById(
"addModal"
).style.display="block";

}


/* =========================
   إغلاق النموذج
========================= */

function closeAddForm(){

document.getElementById(
"addModal"
).style.display="none";

document.getElementById(
"message"
).textContent="";

}


/* =========================
   اختيار الصور
========================= */

document.getElementById(
"images"
).addEventListener(
"change",
function(event){

const files =
Array.from(event.target.files);


if(files.length > 5){

alert(
"يمكنك اختيار 5 صور كحد أقصى."
);

event.target.value="";
selectedFiles=[];

renderPreview();

return;

}


for(const file of files){

if(!file.type.startsWith("image/")){

alert(
"يرجى اختيار ملفات صور فقط."
);

event.target.value="";
selectedFiles=[];

renderPreview();

return;

}


if(file.size > 5 * 1024 * 1024){

alert(
"حجم الصورة يجب ألا يتجاوز 5MB."
);

event.target.value="";
selectedFiles=[];

renderPreview();

return;

}

}


selectedFiles=files;

renderPreview();

}
);


/* =========================
   معاينة الصور
========================= */

function renderPreview(){

const preview =
document.getElementById(
"imagePreview"
);

preview.innerHTML="";


selectedFiles.forEach(
function(file,index){

const box =
document.createElement("div");

box.className=
"preview-box";


const img =
document.createElement("img");

img.src=
URL.createObjectURL(file);


const remove =
document.createElement("button");

remove.type="button";

remove.className=
"remove-image";

remove.textContent="×";


remove.onclick=
function(){

selectedFiles.splice(index,1);

renderPreview();

};


box.appendChild(img);

box.appendChild(remove);

preview.appendChild(box);

}
);

}


/* =========================
   رفع الصور
========================= */

async function uploadImages(
files,
userId
){

const imageUrls=[];


for(let i=0;i<files.length;i++){

const file=files[i];


/*
 اسم فريد للصورة
*/

const extension =
file.name
.split(".")
.pop()
.toLowerCase();


const fileName =
userId +
"/" +
Date.now() +
"_" +
Math.random()
.toString(36)
.substring(2) +
"." +
extension;


/*
 رفع الصورة
*/

const {
error:uploadError
} =
await supabaseClient
.storage
.from("ad-images")
.upload(
fileName,
file,
{
cacheControl:"3600",
upsert:false,
contentType:file.type
}
);


if(uploadError){

console.error(uploadError);

throw new Error(
"فشل رفع إحدى الصور: " +
uploadError.message
);

}


/*
 الحصول على الرابط العام
*/

const {
data:urlData
} =
supabaseClient
.storage
.from("ad-images")
.getPublicUrl(fileName);


imageUrls.push(
urlData.publicUrl
);

}


return imageUrls;

}


/* =========================
   نشر الإعلان
========================= */

document.getElementById(
"adForm"
).addEventListener(
"submit",
async function(event){

event.preventDefault();


const saveButton =
document.getElementById(
"saveButton"
);

const message =
document.getElementById(
"message"
);


saveButton.disabled=true;

saveButton.textContent=
"جاري النشر...";

message.textContent="";


try{


/* المستخدم */

const {
data:userData,
error:userError
} =
await supabaseClient.auth.getUser();


if(
userError ||
!userData.user
){

throw new Error(
"يجب تسجيل الدخول أولاً."
);

}


const user =
userData.user;


/* البيانات */

const title =
document.getElementById(
"title"
).value.trim();


const category =
document.getElementById(
"category"
).value;


const description =
document.getElementById(
"description"
).value.trim();


const priceValue =
document.getElementById(
"price"
).value;


const city =
document.getElementById(
"city"
).value.trim();


const phone =
document.getElementById(
"phone"
).value.trim();


const price =
priceValue === ""
? null
: Number(priceValue);


/* رفع الصور */

let imageUrls=[];


if(selectedFiles.length > 0){

message.textContent=
"📷 جاري رفع الصور...";


imageUrls =
await uploadImages(
selectedFiles,
user.id
);

}


/* حفظ الإعلان */

message.textContent=
"💾 جاري حفظ الإعلان...";


const {
error
} =
await supabaseClient
.from("ads")
.insert({

user_id:user.id,

title:title,

category:category,

description:description,

price:price,

city:city,

phone:phone,

image_urls:imageUrls

});


if(error){

console.error(error);

throw new Error(
"حدث خطأ أثناء حفظ الإعلان: " +
error.message
);

}


/* نجاح */

message.style.color=
"green";

message.textContent=
"✅ تم نشر الإعلان بنجاح";


document.getElementById(
"adForm"
).reset();

selectedFiles=[];

renderPreview();


setTimeout(
function(){

closeAddForm();

loadAds();

},
1000
);


}
catch(error){

console.error(error);

message.style.color=
"red";

message.textContent=
"❌ " + error.message;

}


saveButton.disabled=false;

saveButton.textContent=
"نشر الإعلان";

}
);


/* =========================
   إنشاء بطاقة إعلان
========================= */

function createAdCard(ad){

const card =
document.createElement(
"div"
);

card.className=
"ad-card";


/* الصورة */

if(
ad.image_urls &&
Array.isArray(ad.image_urls) &&
ad.image_urls.length > 0
){

const img =
document.createElement("img");

img.className=
"ad-image";

img.src=
ad.image_urls[0];

img.alt=
ad.title || "صورة الإعلان";

img.loading="lazy";

card.appendChild(img);

}
else{

const noImage =
document.createElement("div");

noImage.className=
"ad-no-image";

noImage.textContent=
"📷";

card.appendChild(noImage);

}


/* المحتوى */

const content =
document.createElement("div");

content.className=
"ad-content";


const title =
document.createElement("h3");

title.textContent=
ad.title || "";

content.appendChild(title);


const category =
document.createElement("div");

category.className=
"ad-category";

category.textContent=
ad.category || "";

content.appendChild(category);


const description =
document.createElement("div");

description.className=
"ad-description";

description.textContent=
ad.description || "";

content.appendChild(description);


if(ad.price !== null){

const price =
document.createElement("div");

price.className=
"ad-price";

price.textContent=
"💰 " +
Number(ad.price).toLocaleString("ar") +
" شيكل";

content.appendChild(price);

}


const info =
document.createElement("div");

info.className=
"ad-info";

info.innerHTML="";


if(ad.city){

const city =
document.createElement("div");

city.textContent=
"📍 " + ad.city;

info.appendChild(city);

}


if(ad.phone){

const phone =
document.createElement("div");

phone.textContent=
"📞 " + ad.phone;

info.appendChild(phone);

}


content.appendChild(info);

card.appendChild(content);

return card;

}


/* =========================
   عرض الإعلانات
========================= */

function displayAds(data){

const adsList =
document.getElementById(
"adsList"
);


if(!data || data.length===0){

adsList.innerHTML=
'<div class="empty">لا توجد إعلانات حاليًا.<br><br>كن أول من يضيف إعلانًا!</div>';

return;

}


adsList.innerHTML="";


data.forEach(
function(ad){

adsList.appendChild(
createAdCard(ad)
);

}
);

}


/* =========================
   تحميل الإعلانات
========================= */

async function loadAds(){

const adsList =
document.getElementById(
"adsList"
);

adsList.innerHTML=
'<div class="empty">جاري تحميل الإعلانات...</div>';


const {
data,
error
} =
await supabaseClient
.from("ads")
.select("*")
.order(
"created_at",
{
ascending:false
}
);


if(error){

console.error(error);

adsList.innerHTML=
'<div class="empty">حدث خطأ أثناء تحميل الإعلانات.<br><br>' +
escapeHTML(error.message) +
'</div>';

return;

}


displayAds(data);

}


/* =========================
   البحث
========================= */

async function searchAds(){

const value =
document.getElementById(
"searchInput"
).value
.trim()
.toLowerCase();


if(value===""){

loadAds();

return;

}


const {
data,
error
} =
await supabaseClient
.from("ads")
.select("*")
.order(
"created_at",
{
ascending:false
}
);


if(error){

console.error(error);

alert(
"حدث خطأ أثناء البحث."
);

return;

}


const filtered =
data.filter(
function(ad){

return (

(ad.title || "")
.toLowerCase()
.includes(value)

||

(ad.description || "")
.toLowerCase()
.includes(value)

||

(ad.category || "")
.toLowerCase()
.includes(value)

||

(ad.city || "")
.toLowerCase()
.includes(value)

);

}
);


displayAds(filtered);

}


/* =========================
   البحث بالضغط Enter
========================= */

document.getElementById(
"searchInput"
).addEventListener(
"keydown",
function(event){

if(event.key==="Enter"){

searchAds();

}

}
);


/* =========================
   حماية النصوص
========================= */

function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   تشغيل الصفحة
========================= */

loadAds();

</script>


</body>

     </html>
