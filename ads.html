<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>الإعلانات | فلسطين بلاتفورم</title>

<style>

/* =========================
   الإعدادات العامة
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#f5f7fa;
    color:#172033;
}

button,
input,
select,
textarea{
    font-family:inherit;
}


/* =========================
   الهيدر
========================= */

header{
    background:white;
    padding:16px 20px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.header{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:#173b68;
}

.logo span{
    color:#b51f2a;
}

.back{
    text-decoration:none;
    background:#173b68;
    color:white;
    padding:9px 16px;
    border-radius:8px;
    white-space:nowrap;
}


/* =========================
   العنوان
========================= */

.hero{
    background:#173b68;
    color:white;
    text-align:center;
    padding:45px 20px;
}

.hero h1{
    font-size:34px;
    margin-bottom:10px;
}

.hero p{
    font-size:17px;
}


/* =========================
   الحاوية
========================= */

.container{
    max-width:1100px;
    margin:auto;
    padding:35px 20px;
}


/* =========================
   إضافة إعلان
========================= */

.add{
    display:block;
    text-align:center;
    background:#b51f2a;
    color:white;
    text-decoration:none;
    padding:14px;
    border-radius:10px;
    margin-bottom:20px;
    font-weight:bold;
    cursor:pointer;
    border:0;
    width:100%;
    font-size:16px;
}

.add:hover{
    opacity:.9;
}


/* =========================
   البحث والفلاتر
========================= */

.filters{
    background:white;
    padding:18px;
    border-radius:14px;
    margin-bottom:25px;
    box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.search{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

.search input{
    flex:1;
    border:1px solid #ddd;
    outline:0;
    padding:13px;
    font-size:16px;
    border-radius:8px;
}

.search input:focus{
    border-color:#173b68;
}

.search button{
    border:0;
    background:#b51f2a;
    color:white;
    padding:0 22px;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

.filter-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.filter-grid select,
.filter-grid input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:14px;
    background:white;
    outline:0;
}

.filter-grid select:focus,
.filter-grid input:focus{
    border-color:#173b68;
}

.filter-buttons{
    display:flex;
    gap:10px;
    margin-top:12px;
}

.filter-buttons button{
    border:0;
    padding:11px 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
}

.apply{
    background:#173b68;
    color:white;
}

.clear{
    background:#eee;
    color:#222;
}


/* =========================
   معلومات النتائج
========================= */

.results-info{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
    gap:10px;
}

.results-count{
    font-size:15px;
    color:#555;
}

.sort-select{
    padding:9px 12px;
    border:1px solid #ddd;
    border-radius:8px;
    background:white;
    outline:0;
}


/* =========================
   الإعلانات
========================= */

.ads-list{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.ad-card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 3px 15px rgba(0,0,0,.07);
    transition:.2s;
    cursor:pointer;
}

.ad-card:hover{
    transform:translateY(-4px);
    box-shadow:0 6px 20px rgba(0,0,0,.12);
}

.ad-image{
    width:100%;
    height:210px;
    object-fit:cover;
    display:block;
    background:#eee;
}

.ad-no-image{
    height:210px;
    background:#eef2f7;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
}

.ad-content{
    padding:18px;
}

.ad-card h3{
    color:#173b68;
    margin-bottom:10px;
    font-size:20px;
}

.ad-category{
    display:inline-block;
    background:#eef2f7;
    color:#173b68;
    padding:5px 10px;
    border-radius:15px;
    font-size:13px;
    margin-bottom:10px;
}

.ad-description{
    color:#555;
    line-height:1.7;
    margin-bottom:10px;
    
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.ad-info{
    color:#666;
    font-size:14px;
    line-height:1.8;
}

.ad-price{
    font-size:19px;
    font-weight:bold;
    color:#b51f2a;
    margin:10px 0;
}

.ad-date{
    color:#888;
    font-size:12px;
    margin-top:5px;
}

.empty{
    background:white;
    padding:50px 20px;
    border-radius:15px;
    text-align:center;
    color:#777;
    grid-column:1/-1;
}


/* =========================
   النافذة
========================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:9999;
    padding:20px;
    overflow:auto;
}

.modal-content{
    background:white;
    max-width:600px;
    margin:30px auto;
    border-radius:15px;
    padding:25px;
}

.modal h2{
    text-align:center;
    margin-bottom:20px;
    color:#173b68;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
}

.form-group textarea{
    min-height:120px;
    resize:vertical;
}


/* =========================
   الصور
========================= */

.image-help{
    font-size:13px;
    color:#777;
    margin-top:6px;
}

.image-preview{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
    margin-top:12px;
}

.preview-box{
    position:relative;
    height:90px;
    border-radius:8px;
    overflow:hidden;
    background:#eee;
}

.preview-box img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.remove-image{
    position:absolute;
    top:3px;
    left:3px;
    width:25px;
    height:25px;
    border:0;
    border-radius:50%;
    background:#b51f2a;
    color:white;
    cursor:pointer;
    font-weight:bold;
}


/* =========================
   أزرار النموذج
========================= */

.form-buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.form-buttons button{
    flex:1;
    padding:13px;
    border:0;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

.save{
    background:#b51f2a;
    color:white;
}

.cancel{
    background:#eee;
    color:#222;
}

.message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
    line-height:1.6;
}


/* =========================
   الهاتف
========================= */

@media(max-width:800px){

    .ads-list{
        grid-template-columns:repeat(2,1fr);
    }

    .filter-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    .header{
        gap:10px;
    }

    .logo{
        font-size:18px;
    }

    .back{
        padding:8px 12px;
        font-size:14px;
    }

    .hero h1{
        font-size:28px;
    }

    .hero p{
        font-size:15px;
    }

    .container{
        padding:25px 12px;
    }

    .search{
        flex-direction:column;
    }

    .search input,
    .search button{
        width:100%;
        min-height:46px;
    }

    .filter-grid{
        grid-template-columns:1fr;
    }

    .filter-buttons{
        flex-direction:column;
    }

    .filter-buttons button{
        width:100%;
    }

    .results-info{
        flex-direction:column;
        align-items:stretch;
    }

    .sort-select{
        width:100%;
    }

    .ads-list{
        grid-template-columns:1fr;
    }

    .image-preview{
        grid-template-columns:repeat(3,1fr);
    }

}

</style>

</head>

<script>

/* =========================
   بيانات Supabase
========================= */

const SUPABASE_URL =
"https://sesbumfedusbjevbsyzl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_0sJrbh73jLip3O5OtJkc_A_9F6OPWqR";


/* =========================
   الاتصال بـ Supabase
========================= */

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth:{
            persistSession:true,
            autoRefreshToken:true,
            detectSessionInUrl:true
        }
    }
);


/* =========================
   متغيرات
========================= */

let selectedFiles = [];

let allAds = [];


/* =========================
   فتح نموذج الإعلان
========================= */

async function openAddForm(){

    const {
        data,
        error
    } =
    await supabaseClient
    .auth
    .getUser();


    if(error || !data.user){

        alert(
            "يجب تسجيل الدخول أولاً لإضافة إعلان."
        );

        window.location.href =
            "login.html";

        return;
    }


    document.getElementById(
        "addModal"
    ).style.display =
        "block";
}


/* =========================
   إغلاق النموذج
========================= */

function closeAddForm(){

    document.getElementById(
        "addModal"
    ).style.display =
        "none";


    document.getElementById(
        "message"
    ).textContent = "";

}


/* =========================
   إغلاق النافذة عند الضغط خارجها
========================= */

document.getElementById(
    "addModal"
).addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            this
        ){

            closeAddForm();

        }

    }
);


/* =========================
   اختيار الصور
========================= */

document.getElementById(
    "images"
).addEventListener(
    "change",
    function(event){

        const files =
            Array.from(
                event.target.files
            );


        if(files.length > 5){

            alert(
                "يمكنك اختيار 5 صور كحد أقصى."
            );

            event.target.value = "";

            selectedFiles = [];

            renderPreview();

            return;
        }


        for(const file of files){

            if(
                !file.type.startsWith(
                    "image/"
                )
            ){

                alert(
                    "يرجى اختيار ملفات صور فقط."
                );

                event.target.value = "";

                selectedFiles = [];

                renderPreview();

                return;
            }


            if(
                file.size >
                5 * 1024 * 1024
            ){

                alert(
                    "حجم الصورة يجب ألا يتجاوز 5MB."
                );

                event.target.value = "";

                selectedFiles = [];

                renderPreview();

                return;
            }

        }


        selectedFiles = files;

        renderPreview();

    }
);


/* =========================
   معاينة الصور
========================= */

function renderPreview(){

    const preview =
        document.getElementById(
            "imagePreview"
        );


    preview.innerHTML = "";


    selectedFiles.forEach(
        function(file,index){

            const box =
                document.createElement(
                    "div"
                );

            box.className =
                "preview-box";


            const img =
                document.createElement(
                    "img"
                );

            img.src =
                URL.createObjectURL(
                    file
                );


            const remove =
                document.createElement(
                    "button"
                );

            remove.type =
                "button";

            remove.className =
                "remove-image";

            remove.textContent =
                "×";


            remove.onclick =
                function(){

                    selectedFiles.splice(
                        index,
                        1
                    );

                    renderPreview();

                };


            box.appendChild(img);

            box.appendChild(remove);

            preview.appendChild(box);

        }
    );

}


/* =========================
   رفع الصور
========================= */

async function uploadImages(
    files,
    userId
){

    const imageUrls = [];


    for(
        let i = 0;
        i < files.length;
        i++
    ){

        const file =
            files[i];


        const extension =
            file.name
            .split(".")
            .pop()
            .toLowerCase();


        const fileName =
            userId +
            "/" +
            Date.now() +
            "_" +
            Math.random()
            .toString(36)
            .substring(2) +
            "." +
            extension;


        const {
            error:uploadError
        } =
        await supabaseClient
        .storage
        .from("ad-images")
        .upload(
            fileName,
            file,
            {
                cacheControl:"3600",
                upsert:false,
                contentType:file.type
            }
        );


        if(uploadError){

            console.error(
                uploadError
            );

            throw new Error(
                "فشل رفع إحدى الصور: " +
                uploadError.message
            );

        }


        const {
            data:urlData
        } =
        supabaseClient
        .storage
        .from("ad-images")
        .getPublicUrl(
            fileName
        );


        imageUrls.push(
            urlData.publicUrl
        );

    }


    return imageUrls;

}


/* =========================
   نشر الإعلان
========================= */

document.getElementById(
    "adForm"
).addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const saveButton =
            document.getElementById(
                "saveButton"
            );


        const message =
            document.getElementById(
                "message"
            );


        saveButton.disabled =
            true;

        saveButton.textContent =
            "جاري النشر...";

        message.textContent =
            "";

        message.style.color =
            "";


        try{


            /* المستخدم */

            const {
                data:userData,
                error:userError
            } =
            await supabaseClient
            .auth
            .getUser();


            if(
                userError ||
                !userData.user
            ){

                throw new Error(
                    "يجب تسجيل الدخول أولاً."
                );

            }


            const user =
                userData.user;


            /* البيانات */

            const title =
                document.getElement
