</style></head><body><div class="container"><h1>🇵🇸 تسجيل الدخول</h1><p class="subtitle">

placeholder="كلمة المرور"
required

<button
    type="submit"
    id="loginButton"
    style="
        display:block;
        width:100%;
        padding:14px;

">

</button>

 <div

    class="message"
></div><div class="links"><a href="register.html">

العودة إلى الرئيسية
</a></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>

const SUPABASE_URL =
    "https://sesbumfedusbjevbsyzl.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_0sJrbh73jLip3O5OtJkc_A_9F6OPWqR";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const form =
    document.getElementById("loginForm");

const button =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");


form.addEventListener("submit", async function(event) {

    event.preventDefault();


    const email =
        document.getElementById("email")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;


    message.textContent = "";

    button.disabled = true;

    button.textContent =
        "جاري تسجيل الدخول...";


    try {

        const {
            data,
            error
        } = await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


        if (error) {

            console.error(error);

            message.textContent =
                "❌ " + error.message;

            return;
        }


        if (data.session) {

            message.style.color =
                "green";

            message.textContent =
                "✅ تم تسجيل الدخول بنجاح";

            setTimeout(function() {

                window.location.href =
                    "index.html";

            }, 1000);

        }

    } catch (error) {

        console.error(error);

        message.textContent =
            "❌ حدث خطأ في الاتصال بـ Supabase";

    } finally {

        button.disabled = false;

        button.textContent =
            "تسجيل الدخول";

    }

});

</script></body></html>
