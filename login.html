<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول - فلسطين بلاتفورم</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 430px;
    background: white;
    padding: 35px;
    border-radius: 16px;
    box-shadow: 0 5px 25px #0002;
}

h1 {
    text-align: center;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 7px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #111;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 25px;
    border: none;
    border-radius: 8px;
    background: #111;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.message {
    margin-top: 15px;
    text-align: center;
    line-height: 1.7;
    min-height: 30px;
}

.links {
    text-align: center;
    margin-top: 20px;
}

.links a {
    color: #111;
    text-decoration: none;
}

.links a:hover {
    text-decoration: underline;
}
</style>

</head>

<body>

<div class="container">

    <h1>🇵🇸 تسجيل الدخول</h1>

    <p class="subtitle">
        مرحبًا بك في فلسطين بلاتفورم
    </p>

    <form id="loginForm">

        <label for="email">
            البريد الإلكتروني
        </label>

        <input
            type="email"
            id="email"
            placeholder="example@email.com"
            autocomplete="email"
            required
        >

        <label for="password">
            كلمة المرور
        </label>

        <input
            type="password"
            id="password"
            placeholder="كلمة المرور"
            autocomplete="current-password"
            required
        >

        <button
            type="submit"
            id="loginButton"
        >
            تسجيل الدخول
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="links">

        <a href="register.html">
            ليس لديك حساب؟ إنشاء حساب
        </a>

        <br><br>

        <a href="index.html">
            العودة إلى الرئيسية
        </a>

    </div>

</div>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://sesbumfedusbjevbsyzl.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_0sJrbh73jLip3O5OtJkc_A_9F6OPWqR";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const form =
    document.getElementById("loginForm");

const button =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");


// إظهار الرسالة
function showMessage(text, color) {

    message.textContent = text;
    message.style.color = color;

}


// التحقق من وجود جلسة سابقة
async function checkSession() {

    try {

        const { data, error } =
            await supabaseClient.auth.getSession();

        if (error) {

            console.error(
                "Session error:",
                error
            );

            return;
        }

        if (data.session) {

            window.location.replace(
                "./index.html"
            );

        }

    } catch (error) {

        console.error(
            "Session check error:",
            error
        );

    }

}


// تسجيل الدخول
form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        showMessage("", "red");

        button.disabled = true;

        button.textContent =
            "جاري تسجيل الدخول...";


        try {

            const { data, error } =
                await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password

                });


            if (error) {

                console.error(
                    "Supabase login error:",
                    error
                );


                if (
                    error.message
                    .toLowerCase()
                    .includes("invalid login credentials")
                ) {

                    showMessage(
                        "❌ البريد الإلكتروني أو كلمة المرور غير صحيحة",
                        "red"
                    );

                }

                else if (
                    error.message
                    .toLowerCase()
                    .includes("email not confirmed")
                ) {

                    showMessage(
                        "❌ يجب تأكيد البريد الإلكتروني أولًا",
                        "red"
                    );

                }

                else {

                    showMessage(
                        "❌ " + error.message,
                        "red"
                    );

                }

                return;
            }


            if (data && data.session) {

                showMessage(
                    "✅ تم تسجيل الدخول بنجاح",
                    "green"
                );


                // إعطاء وقت بسيط لظهور الرسالة
                setTimeout(
                    function() {

                        window.location.replace(
                            "./index.html"
                        );

                    },
                    700
                );

            }

            else {

                showMessage(
                    "❌ تم تسجيل الدخول ولكن لم يتم إنشاء جلسة",
                    "red"
                );

            }


        }

        catch (error) {

            console.error(
                "Unexpected error:",
                error
            );

            showMessage(
                "❌ حدث خطأ أثناء الاتصال بـ Supabase",
                "red"
            );

        }

        finally {

            button.disabled = false;

            button.textContent =
                "تسجيل الدخول";

        }

    }
);


// تشغيل فحص الجلسة
checkSession();

</script>

</body>
    </html>
