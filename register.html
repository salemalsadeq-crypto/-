<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب - فلسطين بلاتفورم</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    width: 92%;
    max-width: 430px;
    background: white;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 5px 25px #0002;
}

.logo {
    text-align: center;
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 12px 0 6px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 22px;
    border: none;
    border-radius: 8px;
    background: #111;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

.login {
    text-align: center;
    margin-top: 20px;
}

.login a {
    color: #111;
    font-weight: bold;
    text-decoration: none;
}

.home {
    display: block;
    text-align: center;
    margin-top: 15px;
    color: #666;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">🇵🇸 فلسطين بلاتفورم</div>

    <div class="subtitle">
        إنشاء حساب جديد
    </div>

    <form onsubmit="createAccount(event)">

        <label>الاسم</label>
        <input type="text" id="name" placeholder="اكتب اسمك" required>

        <label>البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="example@email.com" required>

        <label>كلمة المرور</label>
        <input type="password" id="password" placeholder="كلمة المرور" required>

        <label>تأكيد كلمة المرور</label>
        <input type="password" id="confirmPassword" placeholder="أعد كتابة كلمة المرور" required>

        <button type="submit">
            إنشاء الحساب
        </button>

    </form>

    <div class="login">
        لديك حساب بالفعل؟
        <a href="login.html">تسجيل الدخول</a>
    </div>

    <a class="home" href="index.html">
        ← العودة إلى الرئيسية
    </a>

</div>

<script>

function createAccount(event) {

    event.preventDefault();

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        alert("كلمتا المرور غير متطابقتين");
        return;
    }

    alert("تم استلام بيانات التسجيل. سيتم ربط الحساب بقاعدة البيانات في الخطوة القادمة.");

}

</script>

</body>
  </html>
