<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إنشاء حساب - فلسطين بلاتفورم</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        header {
            background: #198754;
            color: white;
            padding: 18px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            padding: 25px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            margin-top: 0;
            color: #198754;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #198754;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #198754;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        .login a,
        .home {
            color: #198754;
            text-decoration: none;
            font-weight: bold;
        }

        .home {
            display: block;
            text-align: center;
            margin-top: 25px;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            background: #d1e7dd;
            color: #0f5132;
        }

        .error {
            background: #f8d7da;
            color: #842029;
        }
    </style>
</head>

<body>

<header>
    <h1>🇵🇸 فلسطين بلاتفورم</h1>
</header>

<div class="container">

    <div class="card">

        <h2>إنشاء حساب جديد</h2>

        <form id="registerForm">

            <label for="name">الاسم</label>
            <input
                type="text"
                id="name"
                placeholder="اكتب اسمك"
                required
            >

            <label for="email">البريد الإلكتروني</label>
            <input
                type="email"
                id="email"
                placeholder="example@email.com"
                required
            >

            <label for="password">كلمة المرور</label>
            <input
                type="password"
                id="password"
                placeholder="أدخل كلمة المرور"
                minlength="6"
                required
            >

            <label for="confirmPassword">تأكيد كلمة المرور</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="أعد كتابة كلمة المرور"
                minlength="6"
                required
            >

            <button type="submit" id="registerButton">
                إنشاء الحساب
            </button>

        </form>

        <div id="message"></div>

        <div class="login">
            لديك حساب بالفعل؟
            <a href="login.html">تسجيل الدخول</a>
        </div>

        <a class="home" href="index.html">
            ← العودة إلى الصفحة الرئيسية
        </a>

    </div>

</div>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://sesbumfedusbjevbsyzl.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_0sJrbh73jLip3050tJkc_A_9F6OPWqR";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const registerForm = document.getElementById("registerForm");
const registerButton = document.getElementById("registerButton");
const message = document.getElementById("message");


function showMessage(text, type) {

    message.textContent = text;

    message.className = type;

    message.style.display = "block";
}


registerForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    if (!name) {

        showMessage("يرجى كتابة الاسم", "error");
        return;

    }


    if (!email) {

        showMessage("يرجى كتابة البريد الإلكتروني", "error");
        return;

    }


    if (password.length < 6) {

        showMessage(
            "كلمة المرور يجب أن تكون 6 أحرف أو أكثر",
            "error"
        );

        return;

    }


    if (password !== confirmPassword) {

        showMessage(
            "كلمتا المرور غير متطابقتين",
            "error"
        );

        return;

    }


    registerButton.disabled = true;

    registerButton.textContent = "جاري إنشاء الحساب...";


    try {

        const { data, error } =
            await supabaseClient.auth.signUp({

                email: email,

                password: password,

                options: {

                    data: {
                        name: name
                    }

                }

            });


        if (error) {

            console.error(error);

            showMessage(
                "حدث خطأ: " + error.message,
                "error"
            );

            registerButton.disabled = false;

            registerButton.textContent = "إنشاء الحساب";

            return;
        }


        console.log("Registration result:", data);


        if (data.user && !data.session) {

            showMessage(
                "تم إنشاء الحساب بنجاح 🎉 تحقق من بريدك الإلكتروني لتفعيل الحساب.",
                "success"
            );

            registerButton.textContent = "تم إنشاء الحساب";

            setTimeout(function() {

                window.location.href = "login.html";

            }, 4000);

        } else {

            showMessage(
                "تم إنشاء الحساب بنجاح 🎉",
                "success"
            );

            registerButton.textContent = "تم إنشاء الحساب";

            setTimeout(function() {

                window.location.href = "login.html";

            }, 2000);

        }


    } catch (error) {

        console.error(error);

        showMessage(
            "تعذر الاتصال بقاعدة البيانات. حاول مرة أخرى.",
            "error"
        );

        registerButton.disabled = false;

        registerButton.textContent = "إنشاء الحساب";

    }

});

</script>

</body>
</html>
